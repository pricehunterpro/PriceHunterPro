worker_processes 1;

events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    location /api/ {
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    # Cabeceras basicas tambien en local. NO se pone CSP aqui a proposito: el
    # dev-server de Angular usa websocket y scripts inline para el HMR; el CSP
    # de produccion lo aplica Vercel (ver frontend/vercel.json).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
      set $frontend http://frontend:4200;
      proxy_pass $frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
